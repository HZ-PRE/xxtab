name: Build, test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag against Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('Cargo.toml').read_text()
          version = re.search(r'^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text, re.M).group(1)
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must exactly match v<Cargo.toml version>')
          PY
  windows:
    needs: release-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      - run: cargo fmt --check
      - run: cargo test --locked --features windows-gui --all-targets
      - name: Verify updater handoff without installing software
        run: cargo test --locked --lib update::tests::windows_installer_handoff_waits_and_rechecks -- --ignored
      - run: cargo clippy --locked --features windows-gui --all-targets -- -D warnings
      - name: Install packaging compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build minimal Windows installer
        shell: pwsh
        run: ./tools/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: xxtab-windows-x64
          if-no-files-found: error
          path: |
            dist/installers/*-windows-x64-setup.exe
            dist/installers/*-windows-x64-setup.exe.sha256

  linux:
    needs: release-version
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --bin xxtab
      - name: Package CLI and license only
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "xxtab"))')
          mkdir -p dist/installers "$RUNNER_TEMP/xxtab-linux"
          cp target/release/xxtab LICENSE "$RUNNER_TEMP/xxtab-linux/"
          tar -C "$RUNNER_TEMP/xxtab-linux" -czf "dist/installers/xxtab-$version-linux-x64.tar.gz" xxtab LICENSE
          cd dist/installers
          sha256sum "xxtab-$version-linux-x64.tar.gz" > "xxtab-$version-linux-x64.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: xxtab-linux-x64
          if-no-files-found: error
          path: |
            dist/installers/*-linux-x64.tar.gz
            dist/installers/*-linux-x64.tar.gz.sha256

  macos:
    needs: release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Check AppKit Swift types
        run: xcrun swiftc -typecheck -parse-as-library -swift-version 5 -target '${{ matrix.arch }}-apple-macosx13.0' -framework AppKit macos/Xxtab.swift
      - name: Verify native architecture and install system WireGuard
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          brew install bash wireguard-tools wireguard-go
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check real WireGuard and route cleanup
        run: |
          test_binary=$(cargo test --locked --lib --no-run --message-format=json | python3 -c 'import json,sys; rows=[json.loads(line) for line in sys.stdin]; print(next(v["executable"] for v in rows if v.get("executable") and v.get("profile", {}).get("test")))')
          sudo env PATH="$PATH" "$test_binary" system::tests:: --ignored --test-threads=1
      - name: Build AppKit app, smoke test, DMG and ZIP
        env:
          XXTAB_MACOS_LIFECYCLE_TEST: '1'
        run: bash tools/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xxtab-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/installers/*-macos-${{ matrix.arch }}.dmg
            dist/installers/*-macos-${{ matrix.arch }}.dmg.sha256
            dist/installers/*-macos-${{ matrix.arch }}.app.zip
            dist/installers/*-macos-${{ matrix.arch }}.app.zip.sha256

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'HZ-PRE/xxtab'
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xxtab-*
          merge-multiple: true
          path: packages
      - name: Verify complete package set and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd packages
          for suffix in windows-x64-setup.exe linux-x64.tar.gz macos-arm64.dmg macos-arm64.app.zip macos-x86_64.dmg macos-x86_64.app.zip; do
            file="xxtab-$version-$suffix"
            test -s "$file"
            test -s "$file.sha256"
            sha256sum --check "$file.sha256"
          done
          # Never overwrite assets that clients may already have downloaded.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release is already published; create a new version tag"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "xxtab $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" xxtab-* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
